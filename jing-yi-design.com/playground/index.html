olumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 2.47;\">\u003ch2 style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 2.47;\">🪷 What Do Funeral Rituals Mean to You?\u003c/h2>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"5\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">Funeral rituals have a long history in East Asian cultures, symbolizing \u003cb>respect\u003c/b> for the deceased and reverence for life. However, some traditional practices, such as setting off firecrackers and wailing, are still preserved, despite their feudal and incongruous features\u003cb> in the context of \u003cu>urbanization and technological development\u003c/u>\u003c/b>.  \u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003cspan class=\"header2\" style=\"color: rgba(0, 0, 0, 0.85);\">Funerals in Chinese Culture\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"5\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\">\u003cb>\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003c/span>\u003c/b>\u003c/column-unit>\u003ccolumn-unit slot=\"1\">\u003cb>\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">Ghost:\u003c/span>\u003c/b>\u003chr />\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cbr />\nIn the early stages, humans believed in simple polytheistic religions and the existence of spirits and ghosts.\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>Filial Duty 孝:\u003c/b>\u003c/span>\u003chr />\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cbr />\nFilial piety, as a significant role in shaping social norms, involves two aspects: caring for the parents and conducting proper funerals.\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>Cycle:\u003c/b>\u003c/span>\u003chr />\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cbr />\nThe activities during a funeral establish a new family order after the passing, and define a new form of social relationship.\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"4\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>Hope:\u003c/b>\u003c/span>\u003chr />\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cbr />\nFuneral ritual of burying the deceased with their personal belongings signify that secular life is valuable. \u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"5\">\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); display: inline-block; border-width: 0.1rem; border-color: rgba(0,0,0,0.85); border-style: solid; padding: 1.5rem; border-radius: 1.0rem; background: #ffffff;\">Through research, I have found that while people acknowledge the negative impact of funeral rituals, many still consider certain rituals to be irreplaceable due to their cultural significance.\u003cbr />\n\u003cbr />\n\u003cbr />\n\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">By integrating traditional funeral customs with modern technology through human and technology interactions,\u003cb>\u003cu> the design enables the user to express their remembrance of loved ones more smoothly in the context of mourning and funeral traditions\u003c/u>\u003c/b>, allowing for a renewed understanding of the meaning of life within the framework of rituals.\u003c/span>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003cgallery-grid>\u003cmedia-item class=\"zoomable\" grid-span=\"3\" hash=\"J1676949313403371582671573348467\">\u003c/media-item>\u003c/gallery-grid>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set>\u003ccolumn-unit slot=\"0\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"5\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003cspan class=\"header2\" style=\"color: rgba(0, 0, 0, 0.85);\">Context: Funerals in the Modern World\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"5\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">Through research, I have found that while people acknowledge the negative impact of funeral rituals, many still consider certain rituals to be irreplaceable due to their cultural significance.\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003cgallery-grid>\u003cmedia-item class=\"zoomable\" grid-span=\"3\" hash=\"C1676953844477118407948736786547\">\u003c/media-item>\u003c/gallery-grid>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003cgallery-grid>\u003cmedia-item class=\"zoomable\" grid-span=\"3\" hash=\"C1676953844458671663875027234931\">\u003c/media-item>\u003c/gallery-grid>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003cgallery-grid>\u003cmedia-item class=\"zoomable\" grid-span=\"3\" hash=\"B1676953844421778175727608131699\">\u003c/media-item>\u003c/gallery-grid>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003cgallery-grid>\u003cmedia-item class=\"zoomable\" grid-span=\"3\" hash=\"J1676953844403331431653898580083\">\u003c/media-item>\u003c/gallery-grid>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 2;\">Based on the research above, I have concluded that the traditional Chinese funeral rituals may have the following negative impact:\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003cspan style=\"display: inline-block; padding: 1.2rem; border-width: 0.1rem; border-color: rgba(0,0,0,0.85); border-style: solid; border-radius: 1rem;\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 1.2;\">\u003cb>🌱 Environmental Hazard\u003cbr />\n\u003c/b>\u003c/span>\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cbr />Common funeral rituals, such as burning ancestor money, can pose fire hazards and cause air pollution.\u003c/span>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"3\">\u003cspan style=\"display: inline-block; padding: 1.2rem; border-width: 0.1rem; border-color: rgba(0,0,0,0.85); border-style: solid; border-radius: 1rem;\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 1.2;\">\u003cb>💸 Extravagance\u003cbr />\n\u003c/b>\u003c/span>\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cbr />Extravagant funerals can lead to unnecessary feelings of comparison and competition.\u003c/span>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"3\">\u003cspan style=\"display: inline-block; border-width: 0.1rem; border-style: solid; border-radius: 1.0rem; padding: 1.2rem; background: rgba(0, 0, 0, 0); border-color: rgba(0,0,0,0.85);\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 1.2;\">\u003cb>💔 Mental Harm\u003cbr />\n\u003c/b>\u003c/span>\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cbr />The noisy environment and forced late nights during funerals can cause mental harm to people.\u003c/span>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"4\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"4\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"0.5rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"1\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"10\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"0.5rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"1\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"10\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003cspan class=\"header2\" style=\"color: rgba(0, 0, 0, 0.85);\">Current Situation\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"5\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">Through researching nearly 70 years of death statistics and data on funeral ceremonies in China, I discovered that \u003cb>\u003cu>despite the increasing number of deaths over the years, the number of funeral ceremonies has actually decreased\u003c/u>\u003c/b>. These data indirectly reflect a declining enthusiasm among people for holding funeral ceremonies, possibly indicating a shift in their perspectives towards funerals.\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"9\">\u003cgallery-grid columns=\"2\">\u003cmedia-item class=\"zoomable\" hash=\"Y1676963265469124524374971248755\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"U1676963265450677780301261697139\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"I1676963265432231036227552145523\">\u003c/media-item>\u003c/gallery-grid>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"4\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003cspan class=\"header2\" style=\"color: rgba(0, 0, 0, 0.85);\">Funeral Attendees Say:\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"5\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">I collected people&#x27;s opinions on East Asian funeral rituals online from zhihu.com and the survey results from Oriental Daily News to further explore and verify the conclusions I derived from my secondary research.\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"6\">\u003cgallery-grid>\u003cmedia-item class=\"zoomable\" grid-span=\"3\" hash=\"P1676968314638125403858601373811\">\u003c/media-item>\u003c/gallery-grid>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"4\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003cspan class=\"header2\" style=\"color: rgba(0, 0, 0, 0.85);\">Literature Review\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"5\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">This research aims to uncover the core essence of the funeral rituals and shed light on why they continue to hold value and importance to people, even in the face of societal changes and advancements.\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"9\">\u003cgallery-grid columns=\"2\">\u003cmedia-item class=\"zoomable\" hash=\"I1676979686963613125428624879731\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"W1676979686926719637281205776499\">\u003c/media-item>\u003c/gallery-grid>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"4\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003c/span>\u003cspan class=\"header2\" style=\"color: rgba(0, 0, 0, 0.85);\">Participatory Design\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"5\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">I conducted a participatory design activity, inviting five individuals from diverse age groups and branches of Chinese cultural backgrounds to share their past experiences attending funerals. The aim was to identify aspects of funeral rituals that could be enhanced or augmented through technology.\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"6\">\u003cgallery-grid columns=\"1\" gutter=\"0.0rem\" horizontal-align=\"center\">\u003cmedia-item class=\"zoomable\" hash=\"Y1674687163518191573826916970611\">\u003c/media-item>\u003c/gallery-grid>\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"1\">\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"10\">\u003cgallery-grid columns=\"1\">\u003cmedia-item class=\"zoomable\" hash=\"Y1674689284856866562277933707379\">\u003c/media-item>\u003c/gallery-grid>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"8\">\u003cspan animate=\"0\" style=\"color: rgba(0, 0, 0, 0.85); filter: drop-shadow(rgba(0, 0, 0, 0.25) 0rem 0rem 0rem); will-change: filter; display: inline-block; border-width: 0rem; border-color: rgba(0, 0, 0, 0.85); border-style: solid; padding: 0.8rem;\" uses=\"rotation\">I concluded the entire process of an East Asian funeral, including the percentage of people participating in each part of the funeral and their corresponding comments. Upon analyzing the research results, I discovered that the primary complaints centered around the physically demanding rituals that caused discomfort, while others pertained to \u003cb>mental anguish, including instances of sexism.\u003c/b> \u003cbr />\n\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"2\">\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"8\">\u003cspan animate=\"0\" style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 2.04; filter: drop-shadow(0rem 0rem 0rem rgba(0, 0, 0, 0.25)); will-change: filter; display: inline-block; border-width: 0.0rem; border-color: rgba(0,0,0,0.85); border-style: solid; padding: 0.8rem;\" uses=\"rotation\">\u003ci>60% of the participants reported having experienced toxic traditional funerals, while the remaining 40% expressed that they had positive experiences during the funeral and were able to mourn the deceased.\u003c/i> \u003cbr />\n\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003c/span>\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">Considering the current state of East Asian funerals and the varied attitudes people hold toward them, it&#x27;s apparent that funeral rituals evoke \u003cu>\u003cb>mixed feelings\u003c/b>\u003c/u> and aren&#x27;t easily discarded.\u003cbr />\n\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"5\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">This \u003cb>dilemma\u003c/b> has motivated me to create \u003cu>\u003cb>a funeral AR program\u003c/b>\u003c/u> with the goal of prompting participants to openly share their feelings and alleviate emotional distress. Leveraging AR technology, the program will spotlight specific elements of funeral rituals, providing a thought-provoking reflection on their present significance.\u003c/span>\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"2\">\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"8\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"8\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"8\">\u003chr />\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 2;\">\u003ch2 style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 2;\">\u003cmarquee-set behavior=\"scroll\" direction=\"horizontal\" height=\"70vh\" pointer-interaction=\"true\" speed=\"-26\">\u003cmarquee-inner slot=\"contents\">Design Insights\u003c/marquee-inner>\u003c/marquee-set>\u003c/h2>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">Based on the present condition of East Asian funerals and the attitudes of people towards them, it is evident that funeral rituals are something people have \u003cb>mixed feelings\u003c/b> about and \u003cb>\u003cu>cannot easily abandon\u003c/u>\u003c/b>. This dilemma has led me to develop a funeral AR program as a means of satirizing the current state of funeral rituals and people&#x27;s behaviors. The program will utilize AR technology to showcase and highlight certain aspects of funeral rituals that are disliked by many, offering \u003cb>\u003cu>a thought-provoking commentary\u003c/u>\u003c/b> on their current status.\u003cbr />\n\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003c/span>\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003cspan style=\"display: inline-block; padding: 1.2rem;\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 1.2;\">\u003cb>\u003ctext-icon icon=\"north-east-arrow\">\u003c/text-icon>Mission Statement\u003cbr />\n\u003c/b>\u003c/span>\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cbr />How might we change people&#x27;s perception towards death and funerals in Chinese culture, where it is often treated as a taboo subject.\u003c/span>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"2\">\u003cspan style=\"display: inline-block; padding: 1.2rem;\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 1.2;\">\u003cb>\u003ctext-icon icon=\"north-east-arrow\">\u003c/text-icon>User Insights\u003cbr />\n\u003c/b>\u003c/span>\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cbr />Perceptions of East Asian funeral rituals are polarized.\u003c/span>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"3\">\u003cspan style=\"display: inline-block; border-width: 0.1rem; border-color: rgba(0,0,0,0.85); border-style: solid; border-radius: 1.0rem; padding: 1.2rem; background: #ffffff;\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 1.2;\">\u003cb>\u003ctext-icon icon=\"north-east-arrow\">\u003c/text-icon>Design Goal\u003cbr />\n\u003c/b>\u003c/span>\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cbr />Incorporate the latest technology (XR) into the funeral ceremony to challenge people&#x27;s established perceptions of traditional funeral rituals.\u003c/span>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"4\" span=\"2\">\u003c/column-unit>\u003c/column-set>\n\n\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"8\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"8\">\u003chr />\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"8\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"5\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"4\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 1.2;\">\u003ch2 style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 1.2;\">\u003cspan class=\"small-caps\" style=\"color: rgba(0, 0, 0, 0.39); line-height: 1.8;\">Design Ideation\u003c/span>\u003cbr />\nAR Game for Funeral Ritual\u003c/h2>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"5\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"8\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 1.6;\">My design objective is to transition people&#x27;s perceptions of funerals from negative to positive. I aim to enhance emotional experiences and engagement during funerals, ultimately encouraging participants to express their feelings while performing rituals.\u003c/span>\u003cbr />\n\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); display: inline-block; padding-top: 3rem; border-style: solid; padding-bottom: 3rem;\">The design will incorporate the latest technology into the funeral ceremony, such as online funerals or virtual elements.  The use of gamification, which contrasts with the solemnity and sadness commonly associated with funerals, will challenge people&#x27;s established perceptions of traditional funeral rituals.\u003c/span>\u003cbr />\n\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"6\">\u003cgallery-justify gutter=\"0.0rem\" row-height=\"15.8%\">\u003cmedia-item class=\"zoomable\" hash=\"W1674711588575318411538568441971\">\u003c/media-item>\u003cmedia-item class=\"zoomable\" hash=\"Q1674710710215152597784558694515\">\u003c/media-item>\u003c/gallery-justify>\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"1\">\u003c/column-unit>\u003c/column-set>\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cbr />\u003c/span>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003cb>\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003c/span>\u003c/b>\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 1.25;\">\u003cb>Program Sitemap\u003cbr />\n\u003cbr />\n\u003c/b>\u003c/span>\u003cspan style=\"color: rgba(0, 0, 0, 0.85);\">\u003cbr />\nWith the goal of satirizing people&#x27;s mixed feelings towards funerals, my design objective is to enhance people&#x27;s emotional experience and engagement during funerals, in other words, to compel them to cry and perform rituals. Additionally, a Tear Rank system will be implemented to assess individuals&#x27; devotion to their family, adding an entertainment aspect to the program.\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"7\">\u003cmedia-item class=\"zoomable\" hash=\"R1674703449355324256820528017523\" scale=\"24.1rem\">\u003c/media-item>\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"2\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); display: inline-block; padding: 0rem; padding-top: 4.0rem; border-style: solid;\">\u003cspan style=\"color: rgba(0, 0, 0, 0.85); --font-scale: 1.25;\">\u003cb>Low Fidelity Prototype\u003c/b>\u003c/span>\u003c/span>\n\u003cbr />\n\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"8\">\u003cgallery-justify gutter=\"0.0rem\" row-align=\"center\" row-height=\"52.1%\">\u003cmedia-item class=\"zoomable\" hash=\"B1674719684131869343786100191347\" justify-row-end=\"true\">\u003c/media-item>\u003c/gallery-justify>\u003cspan style=\"color: rgb(255, 255, 255);\">\u003cb>\u003c/b>\u003c/span>\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"8\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"4\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\"2.0rem\" mobile-hide-empty=\"false\" mobile-stack=\"true\">\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"3\">\u003c/column-unit>\u003ccolumn-unit slot=\"4\" span=\"2\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set>\u003ccolumn-unit slot=\"0\" span=\"2\">\u003c/column-unit>\u003ccolumn-unit slot=\"1\" span=\"4\">\u003cspan class=\"header2\" style=\"color: rgba(0, 0, 0, 0.85);\">AR Testing\u003c/span>\u003c/column-unit>\u003ccolumn-unit slot=\"2\" span=\"1\">\u003c/column-unit>\u003ccolumn-unit slot=\"3\" span=\"5\">\u003c/column-unit>\u003c/column-set>\u003ccolumn-set gutter=\
